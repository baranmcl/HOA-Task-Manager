app = "hoa-task-manager-staging"
primary_region = "iad"

[build]

[env]
  DJANGO_DEBUG = "False"
  DJANGO_ALLOWED_HOSTS = "hoa-task-manager-staging.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://hoa-task-manager-staging.fly.dev"
  DJANGO_DB_PATH = "/data/db.sqlite3"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/accounts/login/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# No [deploy] release_command: migrations run in entrypoint.sh on the app
# machine, because Fly's release_command machine does not mount the /data
# volume that the SQLite database lives on.
