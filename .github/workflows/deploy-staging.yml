name: Deploy to staging (Fly — dormant)

# Retained but inactive: staging currently runs on PythonAnywhere (see
# docs/runbooks/deploy-pythonanywhere.md). This workflow only runs when
# triggered by hand from the Actions tab. To return to Fly auto-deploy,
# restore the `push` trigger below:
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: []
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app hoa-task-manager-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
