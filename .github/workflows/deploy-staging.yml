name: Deploy to staging (Fly)

# Staging runs on Fly.io. Every push to main triggers a build + deploy.
# See docs/runbooks/deploy-fly.md for the full operational picture.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: []
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app hoa-task-manager-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
