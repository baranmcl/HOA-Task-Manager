{% load humanize %}
<li class="text-sm text-gray-700">
  <span class="text-gray-500" title="{{ log.created_at|date:'M j, Y · g:i A' }}">{{ log.created_at|naturaltime }}</span> —
  <strong>{{ log.actor.profile.display_name }}</strong> {{ log.verb }}
  {% if log.value_change %}<span class="text-xs text-gray-500">({{ log.value_change }})</span>{% endif %}
</li>
